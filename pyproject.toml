[project]
name = "vlm-viewport-optimizer"
version = "0.1.0"
description = "Token- and latency-optimized browser automation for Vision-Language-Model agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.48.0",
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "opencv-python-headless==4.10.0.84",
    "numpy==2.1.3",
    "Pillow==11.0.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
